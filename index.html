<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>FastAPI TTS Tester</title>
</head>
<body>
  <h2>FastAPI TTS Tester (Bangla / English)</h2>
  
  <textarea id="text" rows="4" cols="50">সবাইকে স্বাগতম! এটি একটি টেস্ট ব্যাকএন্ড মেসেজ।</textarea>
  <br><br>
  
  <button id="ttsBtn" onclick="playTTS()">🔊 Read Aloud</button>

  <script>
    let currentAudio = null;
    let currentAudioUrl = null;

    async function playTTS() {
      const textInput = document.getElementById('text').value;
      const ttsBtn = document.getElementById('ttsBtn');

      if (!textInput.trim()) {
        alert("Please enter some text!");
        return;
      }

      // 1. Stop previous audio playing & clean up memory
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      if (currentAudioUrl) {
        URL.revokeObjectURL(currentAudioUrl);
      }

      // 2. Set UI loading state
      ttsBtn.disabled = true;
      ttsBtn.innerText = "⏳ Generating Audio...";

      try {
        const response = await fetch('http://127.0.0.1:9000/api/v1/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: textInput })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.detail || "Failed to generate audio.");
        }

        // 3. Play generated audio
        const audioBlob = await response.blob();
        currentAudioUrl = URL.createObjectURL(audioBlob);
        currentAudio = new Audio(currentAudioUrl);

        currentAudio.onended = () => {
          ttsBtn.innerText = "🔊 Read Aloud";
        };

        await currentAudio.play();

      } catch (error) {
        alert(`Error: ${error.message}`);
      } finally {
        // 4. Reset button state
        ttsBtn.disabled = false;
        if (!currentAudio || currentAudio.paused) {
          ttsBtn.innerText = "🔊 Read Aloud";
        }
      }
    }
  </script>
</body>
</html>
